# Example only — copy to backend-secret.yaml (gitignored) or create directly with kubectl:
#
#   kubectl create secret generic postgres-secrets -n development \
#     --from-literal=POSTGRES_HOST=... \
#     --from-literal=POSTGRES_PORT=5432 \
#     --from-literal=POSTGRES_DATABASE=... \
#     --from-literal=POSTGRES_USER=... \
#     --from-literal=POSTGRES_PASSWORD=...
#
# Key names must match the secretKeyRef entries in backend-deployment.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: development
type: Opaque
stringData:
  POSTGRES_HOST: REPLACE_ME
  POSTGRES_PORT: "5432"
  POSTGRES_DATABASE: REPLACE_ME
  POSTGRES_USER: REPLACE_ME
  POSTGRES_PASSWORD: REPLACE_ME
